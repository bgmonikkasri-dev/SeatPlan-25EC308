<!DOCTYPE html>

<html>
<head>
    <meta charset="UTF-8">
    <title>Generate Seating Plan</title>
</head>
<body>

<h1>Generate Seating Arrangement</h1>

<a href="index.html">← Back to Home</a>

<br><br>

<label>Exam Session ID:</label> <input type="number" id="sessionId">

<button onclick="generateSeating()">Generate Seating Plan</button>

<button onclick="loadSeating()">View Existing</button>

<button onclick="window.print()">Print</button>

<p id="message"></p>

<h2 id="title"></h2>

<div id="seatingGrid"></div>

<script>

async function generateSeating() {

    const sessionId = document.getElementById("sessionId").value;

    if (!sessionId) {
        document.getElementById("message").innerText =
            "Please enter Exam Session ID.";
        return;
    }

    const response = await fetch(
        "/api/seating/generate/" + sessionId,
        {
            method: "POST"
        }
    );

    await handleResponse(response);
}


async function loadSeating() {

    const sessionId = document.getElementById("sessionId").value;

    if (!sessionId) {
        document.getElementById("message").innerText =
            "Please enter Exam Session ID.";
        return;
    }

    const response = await fetch(
        "/api/seating/session/" + sessionId
    );

    await handleResponse(response);
}


async function handleResponse(response) {

    const message = document.getElementById("message");

    message.innerText = "";

    if (!response.ok) {

        const errorMessage = await response.text();

        message.innerText =
            "Unable to generate seating plan: " + errorMessage;

        return;
    }

    const seatingList = await response.json();

    renderGrid(seatingList);
}


function renderGrid(seatingList) {

    const container =
        document.getElementById("seatingGrid");

    container.innerHTML = "";

    if (seatingList.length === 0) {

        container.innerHTML =
            "<p>No seats assigned.</p>";

        return;
    }

    document.getElementById("title").innerText =
        "Seating Plan - " +
        seatingList[0].hallName +
        " - " +
        seatingList[0].examName;


    let maxRow = 0;
    let maxCol = 0;

    seatingList.forEach(function(seat) {

        if (seat.rowNo > maxRow) {
            maxRow = seat.rowNo;
        }

        if (seat.colNo > maxCol) {
            maxCol = seat.colNo;
        }

    });


    const table = document.createElement("table");

    table.border = "1";


    for (let r = 0; r <= maxRow; r++) {

        const row = document.createElement("tr");


        for (let c = 0; c <= maxCol; c++) {

            const cell = document.createElement("td");

            const seat = seatingList.find(function(s) {

                return s.rowNo === r &&
                       s.colNo === c;

            });


            if (seat) {

                cell.innerHTML =
                    "<b>Seat " +
                    (r + 1) +
                    "-" +
                    (c + 1) +
                    "</b><br>" +

                    "Student: " +
                    seat.studentName +
                    "<br>" +

                    "Register No: " +
                    seat.studentRegisterNo +
                    "<br>" +

                    "Class: " +
                    seat.classGroup +
                    "<br>" +

                    "Department: " +
                    seat.department;

            } else {

                cell.innerHTML = "Empty";

            }

            row.appendChild(cell);

        }

        table.appendChild(row);

    }


    container.appendChild(table);
}

</script>

</body>
</html>
